<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --sea: #0f4c75;
    --sea-deep: #0a3352;
    --mint: #2fa596;
    --tang: #e9782a;
    --sky: #4f74c9;
    --paper: #faf7f1;
    --card: #ffffff;
    --ink: #1d2730;
    --muted: #66717c;
    --line: #e7e1d6;
    --soft: #f1ece2;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 17px;
    line-height: 1.5;
    word-break: keep-all;
  }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; }

  /* ---------- 표지 ---------- */
  .cover {
    position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(160deg, var(--sea) 0%, var(--sea-deep) 100%);
    padding: calc(36px + env(safe-area-inset-top)) 20px 60px;
  }
  .cover.has-img {
    background:
      linear-gradient(180deg, rgba(10,51,82,.35) 0%, rgba(10,51,82,.8) 100%),
      var(--cover-img) center / cover no-repeat,
      var(--sea-deep);
  }
  .cover .wrap { position: relative; z-index: 1; }
  .seal {
    display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .08em;
    color: var(--tang); background: #fff3e8; border-radius: 999px; padding: 4px 12px;
  }
  .cover h1 { margin: 14px 0 6px; font-size: 34px; line-height: 1.2; font-weight: 800; letter-spacing: -.02em; }
  .cover .sub { margin: 0; font-size: 17px; opacity: .9; }
  .cover .date { margin: 12px 0 0; font-size: 15px; opacity: .8; }
  .cover h1, .cover .sub, .cover .date { text-shadow: 0 1px 8px rgba(0,0,0,.25); }
  .status {
    margin-top: 18px; display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px; padding: 8px 14px; font-size: 15px; font-weight: 600;
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #7ee0c9; box-shadow: 0 0 0 4px rgba(126,224,201,.25); }
  .waves { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 48px; display: block; }

  /* ---------- 탭 ---------- */
  .tabs-bar {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(250,247,241,.95);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px;
  }
  .tabs { display: grid; grid-template-columns: 1.15fr repeat(5, 1fr); gap: 5px; }
  .tab {
    appearance: none; border: 1px solid var(--line); background: var(--card);
    border-radius: 12px; padding: 7px 0 6px; font: inherit; color: var(--ink); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2;
    position: relative; min-width: 0;
  }
  .tab .d { font-size: 15px; font-weight: 800; }
  .tab .dt { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--sea); border-color: var(--sea); color: #fff; }
  .tab[aria-selected="true"] .dt { color: rgba(255,255,255,.8); }
  .tab .today {
    position: absolute; top: -7px; right: -3px; font-size: 10px; font-weight: 700; color: #fff;
    background: var(--tang); border-radius: 999px; padding: 1px 6px;
  }

  /* ---------- 공통 ---------- */
  .section { padding: 20px 16px 4px; }
  .section h2 { margin: 0 0 12px; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }

  /* ---------- 지도 ---------- */
  .map-box { padding: 16px 16px 0; }
  .map {
    height: 300px; border-radius: 18px; overflow: hidden;
    border: 1px solid var(--line); background: #e8eef0; z-index: 0;
  }
  .map.small { height: 260px; }
  .main-map { display: block; width: 100%; border-radius: 18px; border: 1px solid var(--line); background: var(--soft); }
  .real-map { margin-top: 10px; }
  .real-map summary {
    cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 10px; background: #eef6f4; color: #1d7466; font-size: 14px; font-weight: 700;
  }
  .real-map summary::-webkit-details-marker { display: none; }
  .real-map[open] summary { margin-bottom: 10px; }
  .map-note { margin: 8px 4px 0; font-size: 13px; color: var(--muted); }
  .map-fail { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 14px; text-align: center; padding: 16px; }
  .pin-icon {
    width: 28px; height: 28px; border-radius: 50%; color: #fff;
    display: grid; place-items: center; font: 800 14px/1 "Pretendard", sans-serif;
    border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .city-label {
    background: var(--ink); color: #fff; border: 0; border-radius: 8px;
    font: 800 14px/1 "Pretendard", sans-serif; padding: 6px 9px; box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .city-label::before { display: none; }
  .leaflet-popup-content { font-family: "Pretendard", sans-serif; font-size: 14px; margin: 10px 14px; }

  /* ---------- 전체 일정 ---------- */
  .day-block { overflow: hidden; margin-bottom: 12px; }
  .day-block-head {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    width: 100%; appearance: none; border: 0; background: transparent; font: inherit; color: inherit;
    text-align: left; cursor: pointer;
  }
  .day-thumb { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; flex: 0 0 auto; background: var(--soft); }
  .day-chip {
    width: 60px; height: 60px; border-radius: 12px; flex: 0 0 auto;
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px;
  }
  .day-block-head .k { font-size: 13px; font-weight: 700; }
  .day-block-head .r { font-size: 18px; font-weight: 800; line-height: 1.3; }
  .day-block-head .more { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .mini { list-style: none; margin: 0; padding: 0 14px 10px; }
  .mini li { display: flex; gap: 12px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 15px; }
  .mini .t { flex: 0 0 44px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .mini .alt { color: var(--muted); }

  /* ---------- 데이 화면 ---------- */
  .day-head { padding: 18px 16px 0; }
  .day-head .kicker { font-size: 14px; font-weight: 700; color: var(--accent, var(--sea)); }
  .day-head h3 { margin: 2px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -.01em; }

  .timeline { list-style: none; margin: 0; padding: 12px 16px 8px; }
  .drive {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 0 26px; padding: 8px 0 8px 22px;
    border-left: 2px dashed #c9c1b2; font-size: 14px; color: var(--muted);
  }
  .gap { margin-left: 26px; height: 12px; border-left: 2px solid var(--line); }
  .item {
    display: grid; grid-template-columns: 54px 1fr; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px 14px 14px 12px; scroll-margin-top: 90px;
  }
  .item.tentative { border-style: dashed; background: #fffdfa; }
  .item.past { opacity: .55; }
  .item.now { border: 2px solid var(--tang); box-shadow: 0 6px 20px rgba(233,120,42,.15); }
  .item.next { border-color: var(--accent, var(--sea)); }
  .thumb {
    grid-column: 1 / -1; display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
    border-radius: 12px; background: var(--soft);
  }
  .when { text-align: center; }
  .when .t { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .when .ic { font-size: 26px; line-height: 1; margin-top: 6px; }
  .body { min-width: 0; }
  .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .title-row h4 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.35; }
  .num {
    width: 22px; height: 22px; border-radius: 50%; color: #fff; background: var(--accent, var(--sea));
    display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; flex: 0 0 auto;
  }
  .badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; line-height: 1.4; }
  .badge.now { background: var(--tang); color: #fff; }
  .badge.next { background: var(--accent, var(--sea)); color: #fff; }
  .badge.tag { background: var(--soft); color: var(--muted); }
  .desc { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .map-btn {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 8px 12px;
    border-radius: 10px; background: #eef6f4; color: #1d7466;
    font-size: 14px; font-weight: 700; text-decoration: none;
  }
  .map-btn:active { transform: scale(.98); }
  .maps { display: flex; flex-wrap: wrap; gap: 0 8px; }
  .seg { display: flex; gap: 6px; margin-top: 10px; background: var(--soft); padding: 4px; border-radius: 12px; }
  .seg button {
    flex: 1; appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 14px; font-weight: 700; color: var(--muted);
    padding: 8px 6px; border-radius: 9px; cursor: pointer; line-height: 1.3;
  }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .opt { margin-top: 4px; }

  /* ---------- 숙소 · 팁 ---------- */
  .info-card { padding: 4px 16px; }
  .hotel { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
  .hotel:first-child { border-top: 0; }
  .hotel .n { font-size: 13px; color: var(--muted); }
  .hotel .h { font-size: 17px; font-weight: 700; }
  .hotel .map-btn { margin-top: 0; flex: 0 0 auto; }
  .tips { list-style: none; margin: 0; padding: 0; }
  .tips li { padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .tips li:first-child { border-top: 0; }

  footer { padding: 28px 16px calc(36px + env(safe-area-inset-bottom)); text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header class="cover">
  <div class="wrap">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <p class="date" id="dateText"></p>
    <div class="status"><span class="dot"></span><span id="statusText"></span></div>
  </div>
  <svg class="waves" viewBox="0 0 400 48" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 24 C 60 6, 120 40, 200 22 S 340 6, 400 20 L400 48 L0 48 Z" fill="#faf7f1" opacity=".35"/>
    <path d="M0 32 C 70 16, 140 46, 220 30 S 350 18, 400 30 L400 48 L0 48 Z" fill="#faf7f1"/>
  </svg>
</header>

<nav class="tabs-bar" aria-label="화면 선택">
  <div class="wrap"><div class="tabs" id="tabs" role="tablist"></div></div>
</nav>

<main class="wrap" id="view"></main>

<footer id="notice"></footer>

<script>
(function () {
  const ACCENT = { D0: "#0f4c75", D1: "#2fa596", D2: "#e9782a", D3: "#4f74c9", D4: "#7a5bb5" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // 현재 한국 시각 (테스트용: 주소 뒤에 ?now=2026-11-02T14:50)
  const params = new URLSearchParams(location.search);
  const now = params.get("now") ? new Date(params.get("now") + ":00+09:00") : new Date();
  const at = (date, time) => new Date(`${date}T${time}:00+09:00`);
  const today = new Date(now.getTime() + 9 * 3600e3).toISOString().slice(0, 10);
  const days = TRIP.days;
  const md = (date) => `${+date.slice(5, 7)}/${+date.slice(8, 10)}`;
  const dayName = (d) => d.id === "D0" ? "전날 · 집결" : d.id === "D4" ? "마지막 날" : `${d.id.replace("D", "")}일차`;

  // ---------- 표지 ----------
  $("title").textContent = TRIP.title;
  $("subtitle").textContent = TRIP.subtitle;
  $("dateText").textContent = TRIP.dateText;
  $("notice").textContent = TRIP.notice;
  document.title = TRIP.title;
  if (TRIP.cover) {
    const img = new Image();
    img.onload = () => {
      const c = document.querySelector(".cover");
      c.style.setProperty("--cover-img", `url("${TRIP.cover}")`);
      c.classList.add("has-img");
    };
    img.src = TRIP.cover;
  }
  const first = days[0].date, last = days[days.length - 1].date;
  let status;
  if (today < first) {
    const left = Math.round((new Date(first + "T00:00:00Z") - new Date(today + "T00:00:00Z")) / 86400e3);
    status = `여행까지 D-${left}`;
  } else if (today > last) {
    status = "즐거운 여행이었어요 💛";
  } else {
    const d = days.find((x) => x.date === today);
    status = d ? `오늘은 ${d.id === "D0" ? "집결일" : d.id.replace("D", "") + "일차"} · ${d.region}` : "여행 중";
  }
  $("statusText").textContent = status;

  // ---------- 지금 / 다음 ----------
  const flat = [];
  days.forEach((d) => d.items.forEach((it, i) => flat.push({ d, i, start: at(d.date, it.time) })));
  let nowKey = null, nextKey = null;
  flat.forEach((cur, k) => {
    const nx = flat[k + 1];
    const end = nx && nx.d.date === cur.d.date ? nx.start : at(cur.d.date, "23:59");
    if (now >= cur.start && now < end) nowKey = cur.d.id + ":" + cur.i;
    if (!nextKey && cur.start > now) nextKey = cur.d.id + ":" + cur.i;
  });

  // 지도 핀 번호 (같은 날 같은 좌표는 하나로)
  function pinsOf(d) {
    const pins = [];
    d.items.forEach((it, i) => {
      if (!it.pos) return;
      const prev = pins[pins.length - 1];
      if (prev && prev.pos[0] === it.pos[0] && prev.pos[1] === it.pos[1]) { prev.idx.push(i); prev.titles.push(it.title); return; }
      pins.push({ n: pins.length + 1, pos: it.pos, idx: [i], titles: [it.title], time: it.time });
    });
    return pins;
  }

  // ---------- 지도 ----------
  let map = null;
  function makeMap(el) {
    if (map) { map.remove(); map = null; }
    if (!window.L) { el.innerHTML = `<div class="map-fail">지도를 불러오지 못했어요.<br>인터넷 연결을 확인해 주세요.</div>`; return null; }
    map = L.map(el, { scrollWheelZoom: false, dragging: !L.Browser.mobile, tap: false, zoomSnap: 0.25 });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18, attribution: "© OpenStreetMap",
    }).addTo(map);
    return map;
  }
  const pinIcon = (n, color) => L.divIcon({
    className: "", iconSize: [28, 28], iconAnchor: [14, 14],
    html: `<div class="pin-icon" style="background:${color}">${n}</div>`,
  });

  function drawDayMap(el, d) {
    const m = makeMap(el); if (!m) return;
    const pins = pinsOf(d), color = ACCENT[d.id];
    if (!pins.length) { m.setView([34.8, 128.0], 9); return; }
    if (pins.length > 1) L.polyline(pins.map((p) => p.pos), { color, weight: 3, opacity: .8, dashArray: "6 8" }).addTo(m);
    pins.forEach((p) => {
      L.marker(p.pos, { icon: pinIcon(p.n, color) }).addTo(m)
        .bindPopup(`<b>${p.n}. ${esc(p.titles.join(" / "))}</b><br>${esc(p.time)}`);
    });
    if (pins.length === 1) m.setView(pins[0].pos, 13);
    else m.fitBounds(L.latLngBounds(pins.map((p) => p.pos)), { padding: [30, 30] });
  }

  function drawOverviewMap(el) {
    const m = makeMap(el); if (!m) return;
    const all = [];
    days.forEach((d) => {
      const pts = pinsOf(d).map((p) => p.pos);
      all.push(...pts);
      if (pts.length > 1) L.polyline(pts, { color: ACCENT[d.id], weight: 4, opacity: .85 }).addTo(m);
      pts.forEach((pt) => L.circleMarker(pt, { radius: 5, color: "#fff", weight: 2, fillColor: ACCENT[d.id], fillOpacity: 1 }).addTo(m));
    });
    (TRIP.cities || []).forEach((c) => {
      L.marker(c.pos, { opacity: 0, interactive: false }).addTo(m)
        .bindTooltip(c.name, { permanent: true, direction: "top", offset: [0, -6], className: "city-label" });
    });
    m.fitBounds(L.latLngBounds(all), { padding: [36, 36] });
  }

  // ---------- 화면: 전체 ----------
  const choice = {};
  const mapBtn = (url, label) => url ? `<a class="map-btn" href="${esc(url)}" target="_blank" rel="noopener">📍 ${esc(label || "지도 보기")}</a>` : "";

  function renderOverview() {
    const legend = days.filter((d) => pinsOf(d).length > 1)
      .map((d) => `<span style="color:${ACCENT[d.id]};font-weight:800">━</span> ${dayName(d)}`).join(" &nbsp; ") + " · 선은 순서만 표시";
    const blocks = days.map((d) => `
      <div class="card day-block">
        <button class="day-block-head" data-go="${d.id}">
          <div class="day-chip" style="background:${ACCENT[d.id]}">${d.id}</div>
          ${d.image ? `<img class="day-thumb" src="${esc(d.image)}" alt="" onload="this.previousElementSibling.remove()" onerror="this.remove()">` : ""}
          <div><div class="k" style="color:${ACCENT[d.id]}">${dayName(d)} · ${md(d.date)} (${d.weekday})</div><div class="r">${esc(d.region)}</div></div>
          <span class="more">자세히 ›</span>
        </button>
        <ul class="mini">
          ${d.items.map((it) => `<li><span class="t">${esc(it.time)}</span><span>${esc(it.title)}${
            it.options ? ` <span class="alt">(${it.options.map((o) => esc(o.title)).join(" / ")})</span>` : ""}${
            it.tag ? ` <span class="alt">· ${esc(it.tag)}</span>` : ""}</span></li>`).join("")}
        </ul>
      </div>`).join("");

    $("view").innerHTML = `
      <section class="section">
        <h2>전체 동선</h2>
        <div id="mapArea"></div>
      </section>
      <section class="section"><h2>전체 일정</h2>${blocks}</section>
      <section class="section"><h2>숙소</h2><div class="card info-card">${TRIP.hotels.map((h) => `
        <div class="hotel"><div><div class="n">${esc(h.night)} 숙박</div><div class="h">${esc(h.name)}</div></div>${mapBtn(h.map, "지도")}</div>`).join("")}</div></section>
      <section class="section"><h2>여행 팁</h2><div class="card info-card"><ul class="tips">${TRIP.tips.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div></section>`;
    const realMap = `<div id="map" class="map"></div><p class="map-note">${legend}</p>`;
    const area = $("mapArea");
    const img = new Image();
    img.onload = () => {
      area.innerHTML = `
        <a href="${esc(TRIP.mainMap)}" target="_blank" rel="noopener"><img class="main-map" src="${esc(TRIP.mainMap)}" alt="전체 여행 동선 지도"></a>
        <p class="map-note">그림을 누르면 크게 볼 수 있어요.</p>
        <details class="real-map"><summary>🗺️ 실제 지도로 보기</summary>${realMap}</details>`;
      area.querySelector("details").addEventListener("toggle", (e) => {
        if (e.target.open && !map) drawOverviewMap($("map"));
      }, { once: false });
    };
    img.onerror = () => { area.innerHTML = realMap; drawOverviewMap($("map")); };
    if (map) { map.remove(); map = null; }
    if (TRIP.mainMap) img.src = TRIP.mainMap; else img.onerror();
  }

  // ---------- 화면: 데이 ----------
  function optionBlock(key, it) {
    const sel = choice[key] ?? 0, o = it.options[sel];
    return `
      <div class="seg" role="group" aria-label="플랜 선택">
        ${it.options.map((op, n) => `<button type="button" data-key="${key}" data-n="${n}" aria-pressed="${n === sel}">플랜 ${esc(op.label)}<br><span style="font-weight:500">${esc(op.title)}</span></button>`).join("")}
      </div>
      <div class="opt">${o.desc ? `<p class="desc">${esc(o.desc)}</p>` : ""}${mapBtn(o.map, o.title + " 지도")}</div>`;
  }

  function renderDay(id, scroll) {
    const d = days.find((x) => x.id === id);
    const numOf = {};
    pinsOf(d).forEach((p) => { numOf[p.idx[0]] = p.n; });

    const rows = d.items.map((it, i) => {
      const key = id + ":" + i;
      const cls = ["item"];
      if (it.tag) cls.push("tentative");
      let badge = "";
      if (key === nowKey) { cls.push("now"); badge = `<span class="badge now">지금</span>`; }
      else if (key === nextKey) { cls.push("next"); badge = `<span class="badge next">다음</span>`; }
      else if (at(d.date, it.time) < now) cls.push("past");
      const connector = i === 0 ? "" : it.drive
        ? `<li class="drive">🚗 차로 ${esc(it.drive)}</li>` : `<li class="gap" aria-hidden="true"></li>`;
      const links = it.options ? optionBlock(key, it)
        : it.maps ? `<div class="maps">${it.maps.map((m) => mapBtn(m.url, m.label + " 지도")).join("")}</div>`
        : mapBtn(it.map);
      return `${connector}
        <li class="${cls.join(" ")}" id="it-${id}-${i}">
          ${it.image ? `<img class="thumb" src="${esc(it.image)}" alt="${esc(it.title)}" loading="lazy" onerror="this.remove()">` : ""}
          <div class="when"><div class="t">${esc(it.time)}</div><div class="ic">${it.icon || "📍"}</div></div>
          <div class="body">
            <div class="title-row">${numOf[i] ? `<span class="num">${numOf[i]}</span>` : ""}<h4>${esc(it.title)}</h4>${badge}${it.tag ? `<span class="badge tag">${esc(it.tag)}</span>` : ""}</div>
            ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}
            ${links}
          </div>
        </li>`;
    }).join("");

    const v = $("view");
    v.style.setProperty("--accent", ACCENT[id]);
    v.innerHTML = `
      <div class="map-box">
        <div id="map" class="map small"></div>
        <p class="map-note">숫자 = 아래 일정 번호 · 점선은 순서만 표시 (실제 도로 아님)</p>
      </div>
      <div class="day-head"><div class="kicker">${dayName(d)} · ${+d.date.slice(5, 7)}월 ${+d.date.slice(8, 10)}일 (${d.weekday})</div><h3>${esc(d.region)}</h3></div>
      <ol class="timeline">${rows}</ol>`;
    drawDayMap($("map"), d);

    if (scroll && nowKey && nowKey.startsWith(id + ":")) {
      const t = $("it-" + nowKey.replace(":", "-"));
      if (t) t.scrollIntoView({ block: "center" });
    }
  }

  // ---------- 탭 ----------
  function show(id, scroll) {
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.id === id));
    id === "ALL" ? renderOverview() : renderDay(id, scroll);
  }
  $("tabs").innerHTML =
    `<button class="tab" role="tab" data-id="ALL"><span class="d">전체</span><span class="dt">지도·일정</span></button>` +
    days.map((d) => `<button class="tab" role="tab" data-id="${d.id}">
      ${d.date === today ? `<span class="today">오늘</span>` : ""}
      <span class="d">${d.id}</span><span class="dt">${md(d.date)} ${d.weekday}</span></button>`).join("");

  function goTo(id) {
    show(id);
    const bar = document.querySelector(".tabs-bar");
    const top = bar.offsetTop;
    if (window.scrollY > top) window.scrollTo({ top, behavior: "smooth" });
  }
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) goTo(b.dataset.id); });
  $("view").addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (go) { goTo(go.dataset.go); return; }
    const b = e.target.closest(".seg button");
    if (!b) return;
    choice[b.dataset.key] = +b.dataset.n;
    const y = window.scrollY;
    renderDay(b.dataset.key.split(":")[0]);
    window.scrollTo(0, y);
  });

  // 처음 화면: 여행 중이면 오늘 탭, 아니면 '전체'
  const todayDay = days.find((d) => d.date === today);
  show(todayDay ? todayDay.id : "ALL");

  // 10분마다 새로고침해서 '지금' 표시 갱신
  setInterval(() => { if (!params.has("now")) location.reload(); }, 10 * 60e3);
})();
</script>
</body>
</html>
